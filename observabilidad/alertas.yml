groups:
  - name: cybershield
    rules:
      - alert: CyberShieldCaido
        expr: up{job="cybershield"} == 0
        for: 15s
        labels: { severidad: critica }
        annotations: { resumen: "El servidor de CyberShield no responde" }

      - alert: LatenciaAltaP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route="/"}[1m]))) > 0.3
        for: 30s
        labels: { severidad: aviso }
        annotations: { resumen: "La latencia p95 de la página del juego supera 300 ms" }

      - alert: TasaErrores5xx
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / clamp_min(sum(rate(http_requests_total[1m])), 1e-9) > 0.01
        for: 30s
        labels: { severidad: critica }
        annotations: { resumen: "Más del 1 % de las peticiones terminan en error 5xx" }

      - alert: EventLoopBloqueado
        expr: nodejs_eventloop_lag_seconds > 0.1
        for: 30s
        labels: { severidad: aviso }
        annotations: { resumen: "El event loop de Node.js está bloqueado más de 100 ms" }

      - alert: MemoriaAlta
        expr: process_resident_memory_bytes > 512 * 1024 * 1024
        for: 2m
        labels: { severidad: aviso }
        annotations: { resumen: "El servidor usa más de 512 MB de memoria (posible fuga)" }
