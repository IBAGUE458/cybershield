global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: cybershield
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { app: cybershield }
    # Si defines METRICS_TOKEN en el servidor, descomenta:
    # authorization:
    #   credentials: "TU_TOKEN"
